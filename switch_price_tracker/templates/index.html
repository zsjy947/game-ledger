<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch 卡带价格统计</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236c8cff'/%3E%3Ctext x='32' y='45' font-size='36' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E%C2%A5%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        /* 服务端注入：来源预设选项与版本号（前后端单一数据源） */
        window.__APP__ = {
            version: "{{ version }}",
            sourcePresets: {{ source_presets | tojson }}
        };
    </script>
</head>
<body>
    <div class="container">
        <!-- 品牌页眉 -->
        <header>
            <div class="brand">
                <span class="brand-logo" aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="40" height="40">
                        <defs>
                            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#7d9bff"/>
                                <stop offset="1" stop-color="#5a7af5"/>
                            </linearGradient>
                        </defs>
                        <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#lg)"/>
                        <rect x="14" y="11" width="20" height="26" rx="3" fill="#fff" opacity="0.95"/>
                        <rect x="17" y="15" width="14" height="9" rx="1.5" fill="#0f1117"/>
                        <rect x="17" y="28" width="9" height="3" rx="1.5" fill="#c3ceff"/>
                        <rect x="17" y="33" width="14" height="2" rx="1" fill="#c3ceff" opacity="0.6"/>
                    </svg>
                </span>
                <div class="brand-text">
                    <h1>Switch 卡带价格统计</h1>
                    <p class="tagline">本地卡带价格记录 · NS / NS2 双分类 · 多来源追踪</p>
                </div>
            </div>
        </header>

        <!-- 搜索 & 操作栏 -->
        <div class="toolbar">
            <div class="search-group">
                <input type="text" id="searchInput" placeholder="🔍 搜索卡带名称…" autocomplete="off">
                <select id="categoryFilter">
                    <option value="">全部分类</option>
                    <option value="NS">NS</option>
                    <option value="NS2">NS2</option>
                </select>
                <select id="sourceFilter">
                    <option value="">全部来源</option>
                </select>
                <button id="searchBtn" class="btn btn-secondary">搜索</button>
                <button id="resetBtn" class="btn btn-outline">重置</button>
            </div>
            <button id="addBtn" class="btn btn-primary">＋ 新增卡带</button>
        </div>

        <!-- 统计卡片 -->
        <div class="stat-cards" id="statCards">
            <div class="stat-card">
                <span class="stat-label">总记录</span>
                <span class="stat-value" id="statTotal">-</span>
            </div>
            <div class="stat-card accent-ns">
                <span class="stat-label">NS 卡带</span>
                <span class="stat-value" id="statNS">-</span>
            </div>
            <div class="stat-card accent-ns2">
                <span class="stat-label">NS2 卡带</span>
                <span class="stat-value" id="statNS2">-</span>
            </div>
            <div class="stat-card accent-cost">
                <span class="stat-label">总花费</span>
                <span class="stat-value" id="statCost">-</span>
            </div>
        </div>

        <!-- 来源分布 -->
        <div class="stats" id="statsBar"></div>

        <!-- 数据表格 -->
        <div class="table-wrapper">
            <table id="cartridgeTable">
                <thead>
                    <tr>
                        <th class="cover-col">封面</th>
                        <th class="sortable" data-sort="category">分类</th>
                        <th class="sortable" data-sort="name">名称</th>
                        <th class="sortable" data-sort="price">价格</th>
                        <th class="sortable" data-sort="source">来源</th>
                        <th>备注</th>
                        <th class="sortable" data-sort="updated_at">更新时间</th>
                        <th class="actions-col">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8" class="empty-state">暂无数据，点击「＋ 新增卡带」开始添加</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 模态框：新增 / 编辑 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">新增卡带</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="cartridgeForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="formCategory">分类 <span class="required">*</span></label>
                    <select id="formCategory" required>
                        <option value="">请选择分类</option>
                        <option value="NS">NS</option>
                        <option value="NS2">NS2</option>
                    </select>
                </div>
                <div class="form-group suggest-wrapper">
                    <label for="formName">名称 <span class="required">*</span> <span class="label-hint">（输入名称可联想已有记录与内置游戏库）</span></label>
                    <input type="text" id="formName" placeholder="输入卡带名称" required autocomplete="off">
                    <div class="suggest-dropdown" id="suggestDropdown"></div>
                </div>
                <div class="form-group game-link-group" id="gameLinkGroup">
                    <label>游戏库关联</label>
                    <div class="game-chip" id="gameChip" style="display:none;">
                        <img class="game-chip-cover" id="gameChipCover" alt="">
                        <div class="game-chip-text">
                            <span class="game-chip-title" id="gameChipTitle"></span>
                            <span class="game-chip-meta" id="gameChipMeta"></span>
                        </div>
                        <button type="button" class="game-chip-remove" id="gameChipRemove" title="取消关联">&times;</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="formPrice">价格 (¥)</label>
                    <input type="number" id="formPrice" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="formSource">来源</label>
                    <select id="formSource"></select>
                    <input type="text" id="formSourceCustom" class="source-custom-input" placeholder="填写来源名称…" maxlength="50" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="formNotes">备注</label>
                    <textarea id="formNotes" rows="3" placeholder="可选备注信息…"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 删除确认框 -->
    <div class="modal-overlay" id="confirmOverlay">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2>确认删除</h2>
            </div>
            <p style="margin: 16px 0;">确定要删除这张卡带记录吗？此操作不可撤销。</p>
            <div class="form-actions">
                <button class="btn btn-outline" id="confirmCancel">取消</button>
                <button class="btn btn-danger" id="confirmDelete">确认删除</button>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="detailOverlay">
        <div class="modal modal-detail">
            <div class="modal-header">
                <h2>卡带详情</h2>
                <button class="modal-close" id="detailClose">&times;</button>
            </div>
            <div class="detail-body">
                <div class="detail-cover-wrap">
                    <span class="detail-cover-fallback">🎮</span>
                    <img class="detail-cover" id="detailCover" alt="封面">
                </div>
                <div class="detail-info">
                <div class="detail-name" id="detailName"></div>
                <div class="detail-tags" id="detailTags"></div>
                <div class="detail-rows" id="detailRows"></div>
                <div class="detail-chart" id="detailChart" style="display:none;"></div>
                <div class="detail-intro" id="detailIntro"></div>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-outline" id="detailCloseBtn">关闭</button>
                <button class="btn btn-primary" id="detailEditBtn">编辑此记录</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="footer-logo" aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="18" height="18">
                        <rect x="2" y="2" width="44" height="44" rx="11" fill="#6c8cff"/>
                        <rect x="14" y="11" width="20" height="26" rx="3" fill="#fff" opacity="0.95"/>
                        <rect x="17" y="15" width="14" height="9" rx="1.5" fill="#0f1117"/>
                    </svg>
                </span>
                <span>Switch 卡带价格统计 <code class="version">v{{ version }}</code></span>
            </div>
            <div class="footer-links">
                <span class="footer-chip">Flask</span>
                <span class="footer-chip">SQLite</span>
                <span class="footer-chip">本地运行</span>
            </div>
            <div class="footer-meta">数据存储于本地 data/prices.db · 关闭窗口即退出</div>
        </div>
    </footer>

    <!-- games.js 7MB 数据文件：defer 解除首屏渲染阻塞；两个 defer 脚本按文档顺序执行，
         保证 window.__GAMES__ 在 app.js 运行前就绪（安卓分支依赖同一契约） -->
    <script src="/static/games.js" defer></script>
    <script src="/static/app.js" defer></script>
</body>
</html>
